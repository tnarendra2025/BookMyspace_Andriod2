<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window && prop === 'fetch' && descriptor) {
              if (descriptor.get && !descriptor.set) {
                var currentVal;
                var origGet = descriptor.get;
                descriptor.set = function(val) {
                  currentVal = val;
                };
                descriptor.get = function() {
                  return currentVal !== undefined ? currentVal : origGet.call(this);
                };
                descriptor.configurable = true;
                descriptor.enumerable = true;
              }
            }
            return originalDefineProperty.call(this, obj, prop, descriptor);
          };

          var existingDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (existingDesc && existingDesc.get && !existingDesc.set) {
            var val;
            var origGet = existingDesc.get;
            originalDefineProperty.call(Object, window, 'fetch', {
              get: function() {
                return val !== undefined ? val : origGet.call(this);
              },
              set: function(newVal) {
                val = newVal;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
